[project]
name      = "luma"
directory = "src"
entry     = "src/main.lx"

[build]
flags = "-O2 --no-sanitize"

[output]
binary_dir = "bin"

[dependencies]
paths = [
    "lib/color.lx",
    "lib/json.lx"
]

[test]
valid  = [ "test/valid" ]
errors = [ "test/errors" ]

[run]
// args = "test/test.lx -l std/args.lx -name test"
// args = "test/test.lx -name test"
// The language server (`luma -lsp`) is built into this same binary — see
// src/lsp/*.lx and src/main.lx's build_config.lsp_mode check. --no-sanitize
// is required: the static memory-leak analyzer currently misreports two
// false-positive leaks (src/typechecker/stmt.lx:182,
// src/codegen/codegen_core.lx:29) specifically when this exact file set is
// linked together — not an actual leak, root cause not yet tracked down.
args = "src/main.lx -l src/ast/expr.lx src/ast/module.lx src/ast/type.lx src/ast/stmt.lx src/ast/ast_print.lx src/ast/ast.lx std/cstring.lx std/vector.lx src/constants.lx std/io.lx std/sys.lx src/error/error.lx src/lexer/tokens.lx src/lexer/lexer.lx std/memory.lx src/parser/file.lx src/parser/type.lx src/parser/parser.lx src/parser/expr.lx src/parser/stmt.lx src/typechecker/core.lx src/typechecker/type.lx src/typechecker/scope.lx src/typechecker/expr.lx src/typechecker/tc_error.lx src/typechecker/tc.lx src/typechecker/stmt.lx src/codegen/codegen_core.lx src/codegen/codegen_type.lx src/codegen/codegen_expr.lx src/codegen/codegen_stmt.lx std/libc.lx src/codegen/codegen.lx std/args.lx src/commands.lx lib/color.lx lib/json.lx src/lsp/lsp_transport.lx src/lsp/lsp_document.lx src/lsp/lsp_dispatch.lx src/lsp/lsp_main.lx -O2 --no-sanitize -name bin/luma"
