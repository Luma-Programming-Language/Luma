name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap, self-verify, and test
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="luma-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp bin/luma "$STAGE/luma"
          cp -r std "$STAGE/std"
          cp scripts/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-linux-x86_64
          path: luma-*-linux-x86_64.tar.gz

  # Windows: mingw-w64 is a real GNU cross-compiler (a normal package, not
  # a separate language/toolchain), so this cross-builds a linked binary
  # directly on Linux — see src/codegen/codegen.lx's target_cc_prefix.
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap a native bin/luma
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-build for Windows x86_64
        run: ./scripts/cross-build.sh windows64 dist-windows/luma

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="luma-${VERSION}-windows-x86_64"
          mkdir -p "$STAGE"
          cp dist-windows/luma.exe "$STAGE/luma.exe"
          cp -r std "$STAGE/std"
          cp scripts/install.bat "$STAGE/install.bat"
          zip -r "${STAGE}.zip" "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x86_64
          path: luma-*-windows-x86_64.zip

  smoke-test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: luma-windows-x86_64

      - name: Extract and run --version
        shell: bash
        run: |
          unzip luma-*-windows-x86_64.zip
          cd luma-*-windows-x86_64
          # --version exits 1 by this compiler's existing convention (same
          # as --help/--license) — that's not a smoke-test failure, so
          # check the output rather than the exit code.
          out="$(./luma.exe --version || true)"
          echo "$out"
          echo "$out" | grep -q "Luma Compiler"

  # macOS: no real cross-compiler package exists for it (only osxcross,
  # which needs Apple's SDK extracted from a real Xcode install — not
  # something to depend on here). Transpile to C on Linux with
  # -t macos -c/--no-compile, then hand that C to a macos-latest runner's
  # own preinstalled clang to actually build and link.
  transpile-macos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap a native bin/luma
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Transpile to C for macOS
        run: ./scripts/transpile.sh macos dist-macos-src/luma.c

      - name: Upload transpiled source
        uses: actions/upload-artifact@v4
        with:
          name: macos-transpiled-source
          path: dist-macos-src/luma.c

  build-macos:
    needs: transpile-macos
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download transpiled source
        uses: actions/download-artifact@v4
        with:
          name: macos-transpiled-source
          path: dist-macos-src

      - name: Compile and link with the native toolchain
        run: |
          mkdir -p dist-macos
          cc -w -O2 dist-macos-src/luma.c -lm -o dist-macos/luma

      - name: Smoke test — run it right here, on real macOS
        run: |
          out="$(./dist-macos/luma --version || true)"
          echo "$out"
          echo "$out" | grep -q "Luma Compiler"

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="luma-${VERSION}-macos-x86_64"
          mkdir -p "$STAGE"
          cp dist-macos/luma "$STAGE/luma"
          cp -r std "$STAGE/std"
          cp scripts/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-macos-x86_64
          path: luma-*-macos-x86_64.tar.gz

  # One job, after everything else has actually passed, publishes exactly one
  # release with all three archives attached — not the intermediate
  # macos-transpiled-source artifact (excluded by the luma-* pattern below).
  # Also the only place a version's written release notes
  # (docs/releases/vX.Y.Z.md, if present) become the release body instead of
  # GitHub's auto-generated commit list.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux-x86_64
      - build-windows
      - smoke-test-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: luma-*
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/luma-*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
