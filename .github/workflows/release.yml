name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap, self-verify, and test
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="luma-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp bin/luma "$STAGE/luma"
          cp -r std "$STAGE/std"
          cp scripts/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-linux-x86_64
          path: luma-*-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: luma-*-linux-x86_64.tar.gz
          generate_release_notes: true
