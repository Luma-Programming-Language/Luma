name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap, self-verify, and test
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="luma-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp bin/luma "$STAGE/luma"
          cp -r std "$STAGE/std"
          cp scripts/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-linux-x86_64
          path: luma-*-linux-x86_64.tar.gz

  build-cross-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bootstrap a native bin/luma
        run: ./scripts/bootstrap-build.sh bootstrap/luma-seed

      - name: Install zig (cross C toolchain)
        run: |
          ZIG_VERSION=0.16.0
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p /tmp/zig-install
          tar -xf /tmp/zig.tar.xz -C /tmp/zig-install --strip-components=1
          echo "/tmp/zig-install" >> "$GITHUB_PATH"

      - name: Cross-build for Windows x86_64
        run: ./scripts/cross-build.sh windows64 dist-windows/luma

      - name: Cross-build for macOS x86_64
        run: ./scripts/cross-build.sh macos dist-macos/luma

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"

          WIN_STAGE="luma-${VERSION}-windows-x86_64"
          mkdir -p "$WIN_STAGE"
          cp dist-windows/luma.exe "$WIN_STAGE/luma.exe"
          cp -r std "$WIN_STAGE/std"
          cp scripts/install.bat "$WIN_STAGE/install.bat"
          zip -r "${WIN_STAGE}.zip" "$WIN_STAGE"

          MAC_STAGE="luma-${VERSION}-macos-x86_64"
          mkdir -p "$MAC_STAGE"
          cp dist-macos/luma "$MAC_STAGE/luma"
          cp -r std "$MAC_STAGE/std"
          cp scripts/install.sh "$MAC_STAGE/install.sh"
          chmod +x "$MAC_STAGE/install.sh"
          tar -czf "${MAC_STAGE}.tar.gz" "$MAC_STAGE"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x86_64
          path: luma-*-windows-x86_64.zip

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-macos-x86_64
          path: luma-*-macos-x86_64.tar.gz

  smoke-test-windows:
    needs: build-cross-platform
    runs-on: windows-latest
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: luma-windows-x86_64

      - name: Extract and run --version
        shell: bash
        run: |
          unzip luma-*-windows-x86_64.zip
          cd luma-*-windows-x86_64
          # --version exits 1 by this compiler's existing convention (same
          # as --help/--license) — that's not a smoke-test failure, so
          # check the output rather than the exit code.
          out="$(./luma.exe --version || true)"
          echo "$out"
          echo "$out" | grep -q "Luma Compiler"

  smoke-test-macos:
    needs: build-cross-platform
    runs-on: macos-latest
    steps:
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: luma-macos-x86_64

      - name: Extract and run --version
        run: |
          tar -xzf luma-*-macos-x86_64.tar.gz
          cd luma-*-macos-x86_64
          chmod +x luma
          # --version exits 1 by this compiler's existing convention (same
          # as --help/--license) — that's not a smoke-test failure, so
          # check the output rather than the exit code.
          out="$(./luma --version || true)"
          echo "$out"
          echo "$out" | grep -q "Luma Compiler"

  # One job, after everything else has actually passed, publishes exactly one
  # release with all three archives attached. Previously each build job
  # published on its own — two concurrent "create/update this tag's release"
  # calls racing each other, neither one gated on the cross-compiled binaries
  # having been proven to actually run. Also the only place a version's
  # written release notes (docs/releases/vX.Y.Z.md, if present) become the
  # release body instead of GitHub's auto-generated commit list.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux-x86_64
      - build-cross-platform
      - smoke-test-windows
      - smoke-test-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: luma-*
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/luma-*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
